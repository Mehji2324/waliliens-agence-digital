name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Lint Codebase
        run: npm run lint

      - name: Server Typecheck
        run: npm run server:typecheck

      - name: Run Server Test Suite
        run: npm run test:server

      - name: Run Frontend Test Suite
        run: npm run test:frontend

      - name: Build Frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        run: docker build -t waliliens-server:ci ./server

      - name: Build Frontend Docker Image
        run: docker build -t waliliens-frontend:ci .
